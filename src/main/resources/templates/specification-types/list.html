<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:attr="data-page=${activePage}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle}">Типы характеристик</title>
  <link rel="stylesheet" th:href="@{/assets/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header(${activePage})}"></div>

<main class="container page-shell">
  <section class="page-hero">
    <div>
      <p class="eyebrow">Каталог</p>
      <h1>Типы характеристик</h1>
      <p>Список текстовых типов характеристик с поиском и пагинацией.</p>
    </div>
    <div class="header-actions">
      <a class="button button--primary" th:href="@{/specification-types/create}">+ Новый тип</a>
    </div>
  </section>

  <form class="toolbar toolbar--panel" method="get" th:action="@{/specification-types}">
    <input class="input" type="text" name="query" placeholder="Поиск по названию или описанию..." th:value="${specificationTypeFilter.query}" style="flex:1; min-width:220px;">
    <button class="button button--primary" type="submit">Найти</button>
    <a class="button button--ghost" th:href="@{/specification-types}">Сбросить</a>
  </form>

  <section class="cards-grid" th:if="${not #lists.isEmpty(specificationTypes)}">
    <article class="card card--hover" th:each="item : ${specificationTypes}">
      <div class="card__body">
        <div class="card__top">
          <div>
            <h3 th:text="${item.name}">Name</h3>
            <div class="card__meta" th:text="${item.description}">Description</div>
          </div>
          <span class="badge badge--orange">Spec type</span>
        </div>

        <div class="card__actions">
          <a class="button button--ghost button--sm" th:href="@{/specification-types/{id}/edit(id=${item.id})}">Изменить</a>
        </div>
      </div>
    </article>
  </section>

  <div class="empty-state" th:if="${#lists.isEmpty(specificationTypes)}">
    Ничего не найдено.
  </div>

  <div class="pagination" th:if="${totalPages > 1}">
    <a th:if="${currentPage > 1}"
       th:href="@{/specification-types(page=${currentPage - 1}, query=${specificationTypeFilter.query})}">
      ←
    </a>

    <a th:each="p : ${#numbers.sequence(1, totalPages)}"
       th:classappend="${p == currentPage} ? ' is-active'"
       th:text="${p}"
       th:href="@{/specification-types(page=${p}, query=${specificationTypeFilter.query})}">
    </a>

    <a th:if="${currentPage < totalPages}"
       th:href="@{/specification-types(page=${currentPage + 1}, query=${specificationTypeFilter.query})}">
      →
    </a>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/assets/js/ui.js}"></script>
</body>
</html>
