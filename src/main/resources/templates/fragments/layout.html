<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}">PC ASSEMBLER</title>
  <link rel="stylesheet" th:href="@{/assets/css/styles.css}">
</head>
<body th:attr="data-page=${activePage}">
  <div th:replace="~{fragments/header :: header(${activePage})}"></div>

  <main class="container page-shell">
    <th:block th:insert="${content}"></th:block>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/assets/js/ui.js}"></script>
</body>
</html>
