spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  liquibase:
    enabled: true
  application:
    name: pc-assembler
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

logging:
  level:
    sql: debug

springdoc:
  swagger-ui:
    document-title: PC Assembler API

## Properties
minio:
  root:
    user: ${MINIO_ROOT_USER}
    password: ${MINIO_ROOT_PASSWORD}