spring:
  # для локального запуска из IDE; в контейнере переменные приходят из docker-compose
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  liquibase:
    enabled: true
  application:
    name: pc-assembler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pc_assembler}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

logging:
  level:
    sql: ${LOG_LEVEL_SQL:debug}

springdoc:
  swagger-ui:
    document-title: PC Assembler API

## Properties
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  root:
    user: ${MINIO_ROOT_USER}
    password: ${MINIO_ROOT_PASSWORD}